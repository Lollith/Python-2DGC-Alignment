<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLab 2DGC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>
    <div class="modal fade" id="fileExplorerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Explorateur de fichiers</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="currentPath" class="mb-3"></div>
                    <div id="fileList" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" id="selectFolder" class="btn btn-primary">Sélectionner ce dossier</button>
                </div>
            </div>
        </div>
    </div>

    <div id="dockerPathMeta" data-docker-path="{{ host_volume_path }}"></div>


    <div class="container">
        <div class="header">
            <h1>🔬 DataLab 2DGC</h1>
            <p>Conversion de données et analyses </p>
        </div>
        
        <div class="main-content">
            <div class="tabs">
                <button class="tab active" onclick="showTab('conversion')">
                    📁 <span>Conversion</span>
                </button>
                <button class="tab" onclick="showTab('analysis')">
                    🔬 <span>Analyses</span>
                </button>
                <button class="tab" onclick="showTab('monitoring')">
                    📊 <span>Monitoring</span>
                </button>
            </div>
            
            <!-- Tab Conversion -->
            <div id="conversion" class="tab-content active">
                <div class="form-card">
                    <form id="converterForm">
                        <div class="form-group">
                            <label for="inputPath">📁 Chemin d'entrée</label>
                            <div class="input-group">
                                <span class="input-icon">📂</span>
                                <input type="text" id="inputPath" name="inputPath" class="form-control" placeholder="Exemple: /mon/chemin">
                                <button type="button" class="btn btn-outline-secondary" onclick="openFileExplorer('inputPath')">
                                    📁 Parcourir
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="files">📄 Fichiers spécifiques (optionnel)</label>
                            <div class="input-group">
                                <span class="input-icon">📋</span>
                                <input type="text" id="files" name="files" 
                                       placeholder="file1.cdf, file2.cdf (vide = tous les fichiers)">
                            </div>
                        <div id="availableFiles" class="files-list" style="display: none;"></div>
                        </div>
                        <div class="form-group">
                            <label for="outputPath">💾 Chemin de sortie</label>
                            <div class="input-group">
                                <span class="input-icon">💾</span>
                                <input type="text" id="outputPath" name="outputPath" class="form-control" placeholder="Sélectionnez un dossier…">
                                <button type="button" class="btn btn-outline-secondary" onclick="openFileExplorer('outputPath')">
                                    📁 Parcourir
                                </button>
                            </div>
                        </div> 
                        
                        <div class="button-group">
                            <button type="button" id="listFilesBtn" class="btn btn-secondary">
                                📋 <span>Lister les fichiers CDF</span>
                            </button>
                            <button type="submit" id="runBtn" class="btn btn-primary">
                                ▶️ <span>Convertir en HDF5</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Tab Analysis -->
            <div id="analysis" class="tab-content">
                <div id="dockerStatus" class="docker-status docker-stopped">
                    <div class="status-indicator status-stopped"></div>
                    🔴 État des conteneurs Docker: Non vérifié
                </div>

                <div class="form-card">
                    <form id="analysisForm">
                        <div class="form-group">
                            <label for="analysisPath">📁 Chemin des fichiers HDF5</label>
                            <div class="input-group">
                                <span class="input-icon">📂</span>
                                <input type="text" id="analysisPath" name="analysis_path" class="form-control" placeholder="Exemple: /mon/chemin">
                                <button type="button" class="btn btn-outline-secondary" onclick="openFileExplorer('analysisPath')">
                                    📁 Parcourir
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="h5Files">📊 Fichiers HDF5 à analyser</label>
                            <select id="h5Files" name="h5Files" multiple size="8">
                                <option value="">Cliquez sur "Lister fichiers HDF5" pour voir les fichiers disponibles</option>
                            </select>
                            <small style="color: var(--text-secondary); font-style: italic; margin-top: 8px; display: block;">
                                Maintenez Ctrl (ou Cmd sur Mac) pour sélectionner plusieurs fichiers
                            </small>
                        </div>
                        
                        <div class="button-group">
                            <button type="button" id="listH5Btn" class="btn btn-secondary">
                                📋 <span>Lister fichiers HDF5</span>
                            </button>
                            <button type="button" id="checkDockerBtn" class="btn btn-warning">
                                🐳 <span>Lancer Docker</span>
                            </button>
                            <button type="submit" id="analyzeBtn" class="btn btn-primary">
                                🔬 <span>Jupyter Lab</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tab Monitoring -->
            <div id="monitoring" class="tab-content">
                <div class="form-card">
                    <h3>📊 État du système</h3>
                    <div id="systemStatus">
                        <div class="docker-status docker-stopped">
                            <div class="status-indicator status-stopped"></div>
                            Chargement des informations système...
                        </div>
                    </div>
                    
                    <div class="button-group">
                        <button type="button" id="refreshStatusBtn" class="btn btn-secondary">
                            🔄 <span>Actualiser l'état</span>
                        </button>
                        <button type="button" id="viewLogsBtn" class="btn btn-warning">
                            📜 <span>Voir les logs</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="output-section">
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>⏳ Traitement en cours...</p>
                </div>
                <div id="output" class="output"></div>
                <div class="progress-bar" id="progressBar" style="display: none;">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
       fillDefaultPaths({{ host_volume_path | tojson | safe }}); 
    </script>
</body>
</html>
